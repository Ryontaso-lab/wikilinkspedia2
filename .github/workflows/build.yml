name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 古い/不完全なandroidフォルダを一旦リセットして完全な最新土台を生成
      - name: Recreate Clean Android Scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ryontaso.wikilinks .
          
          # 生成された AndroidManifest.xml に共有受け取りアンテナを自動注入
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          intent = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"text/plain\" />
                      </intent-filter>
                  </activity>'''
          new_content = content.replace('</activity>', intent)
          with open(path, 'w') as f:
              f.write(new_content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WikiConstellation-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

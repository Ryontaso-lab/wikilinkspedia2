name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ryontaso.wikilinks .
          
          # 1. Android SDK のバージョンをプラグイン要求の 37 に引き上げる
          python3 -c "
          import re
          path = 'android/app/build.gradle.kts'
          try:
              with open(path, 'r') as f:
                  txt = f.read()
              # compileSdk / targetSdk を 37 に置換
              txt = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 37', txt)
              txt = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 37', txt)
              with open(path, 'w') as f:
                  f.write(txt)
          except Exception:
              # build.gradle (Groovy) 形式の場合のフォールバック
              path_groovy = 'android/app/build.gradle'
              with open(path_groovy, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 37', txt)
              txt = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 37', txt)
              with open(path_groovy, 'w') as f:
                  f.write(txt)
          "

          # 2. AndroidManifest.xml に共有受け取りアンテナを自動注入
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          intent = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"text/plain\" />
                      </intent-filter>
                  </activity>'''
          new_content = content.replace('</activity>', intent)
          with open(path, 'w') as f:
              f.write(new_content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WikiConstellation-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
